<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1917">Quy trình tổng thể — mỗi khâu một trách nhiệm, một công cụ</text>

  <!-- Hàng 1: Từ khóa -->
  <text x="30" y="78" font-size="13" font-weight="700" fill="#78716c">A. DANH MỤC TỪ KHÓA</text>
  <g>
    <rect x="30" y="90" width="270" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="45" y="116" font-size="16.5" font-weight="700" fill="#78350f">1. Trinh sát từ khóa</text>
    <text x="45" y="138" font-size="14" fill="#44403c">Cộng tác viên · Apify (key cá nhân)</text>
    <text x="45" y="158" font-size="14" fill="#44403c">Quét thử, tìm từ lóng mới</text>
    <text x="45" y="178" font-size="14" fill="#44403c">→ Phiếu đề xuất hashtag</text>
  </g>
  <g>
    <rect x="365" y="90" width="270" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="380" y="116" font-size="16.5" font-weight="700" fill="#312e81">2. Duyệt từ khóa</text>
    <text x="380" y="138" font-size="14" fill="#44403c">Nghiên cứu viên</text>
    <text x="380" y="158" font-size="14" fill="#44403c">Xem tỷ lệ bài liên quan</text>
    <text x="380" y="178" font-size="14" fill="#44403c">→ Danh mục, 4 nhóm cố định</text>
  </g>
  <line x1="300" y1="145" x2="360" y2="145" stroke="#57534e" stroke-width="2" marker-end="url(#a)"/>

  <!-- Hàng 2: Bài viết -->
  <text x="160" y="250" font-size="13" font-weight="700" fill="#78716c">B. BÀI VIẾT VÀ SỐ LIỆU (hệ thống tự chạy)</text>
  <g>
    <rect x="30" y="262" width="220" height="120" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="45" y="288" font-size="16.5" font-weight="700" fill="#14532d">3. Phát hiện bài</text>
    <text x="45" y="310" font-size="14" fill="#44403c">Apify · hằng ngày</text>
    <text x="45" y="330" font-size="14" fill="#44403c">Lần chạy DISCOVERY</text>
    <text x="45" y="350" font-size="14" fill="#44403c">→ Bài mới + lần đo đầu</text>
  </g>
  <g>
    <rect x="280" y="262" width="210" height="120" rx="12" fill="#fce7f3" stroke="#db2777"/>
    <text x="295" y="288" font-size="16.5" font-weight="700" fill="#831843">4. Sàng lọc</text>
    <text x="295" y="310" font-size="14" fill="#44403c">Quy tắc → AI → người</text>
    <text x="295" y="330" font-size="14" fill="#44403c">Trong 24 giờ</text>
    <text x="295" y="350" font-size="14" fill="#44403c">→ Liên quan hay không</text>
  </g>
  <g>
    <rect x="520" y="262" width="220" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="535" y="288" font-size="16.5" font-weight="700" fill="#0c4a6e">5. Đo biến động</text>
    <text x="535" y="310" font-size="14" fill="#44403c">Social Fetch · theo lịch</text>
    <text x="535" y="330" font-size="14" fill="#44403c">Lần chạy MEASURE</text>
    <text x="535" y="350" font-size="14" fill="#44403c">→ Số liệu theo thời gian</text>
  </g>
  <g>
    <rect x="770" y="262" width="200" height="120" rx="12" fill="#f5f5f4" stroke="#57534e"/>
    <text x="785" y="288" font-size="16.5" font-weight="700" fill="#1c1917">7. Tổng hợp</text>
    <text x="785" y="310" font-size="14" fill="#44403c">Dashboard</text>
    <text x="785" y="330" font-size="14" fill="#44403c">Dữ liệu phẳng</text>
    <text x="785" y="350" font-size="14" fill="#44403c">Danh sách chuyển tuyến</text>
  </g>
  <line x1="250" y1="322" x2="276" y2="322" stroke="#57534e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="322" x2="516" y2="322" stroke="#57534e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="322" x2="766" y2="322" stroke="#57534e" stroke-width="2" marker-end="url(#a)"/>
  <!-- từ danh mục xuống phát hiện -->
  <path d="M500 200 L500 228 L140 228 L140 258" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="222" font-size="13" fill="#78716c">từ khóa đã duyệt</text>
  <!-- không liên quan: dừng -->
  <text x="295" y="400" font-size="13" fill="#9f1239">Không liên quan → giữ lại, không đo tiếp</text>

  <!-- Hàng 3: nhiệt kế -->
  <text x="30" y="440" font-size="13" font-weight="700" fill="#78716c">C. GÓC NHÌN ĐẶT CẠNH</text>
  <g>
    <rect x="520" y="452" width="220" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="535" y="478" font-size="16.5" font-weight="700" fill="#4c1d95">6. Nhiệt kế từ khóa</text>
    <text x="535" y="500" font-size="14" fill="#44403c">Social Fetch · hằng tuần</text>
    <text x="535" y="520" font-size="14" fill="#44403c">TikTok · Lần chạy TREND</text>
  </g>
  <path d="M740 497 L870 497 L870 386" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M635 200 L960 200 L960 430 L630 430 L630 448" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- chú giải -->
  <text x="30" y="485" font-size="13" fill="#57534e">Màu: vàng = cộng tác viên · tím xanh = nghiên cứu viên ·</text>
  <text x="30" y="503" font-size="13" fill="#57534e">xanh lá = Apify · hồng = sàng lọc · xanh dương, tím = Social Fetch</text>
  <text x="30" y="530" font-size="13" fill="#57534e">Lần chạy DISCOVERY / MEASURE / TREND ghi nhật ký và chi phí riêng.</text>
</svg>
