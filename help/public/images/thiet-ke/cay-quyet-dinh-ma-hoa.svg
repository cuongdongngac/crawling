  <text x="40" y="92" fill="#1c1917">1. Bài có nói về thuốc lá điện tử, nung nóng,</text>
  <text x="40" y="112" font-size="11.5" fill="#57534e">tinh dầu hay phụ kiện? Hashtag tìm kiếm không tính</text>
  <text x="40" y="192" fill="#1c1917">2. Người đăng mời mua, đổi hoặc nhận hàng?</text>
  <text x="40" y="212" font-size="11.5" fill="#57534e">giá, liên hệ, giao hàng, hàng về, thanh lý, pass lại</text>
  <text x="40" y="292" fill="#1c1917">3. Người đăng muốn mua, xin chỗ bán?</text>
  <text x="40" y="312" font-size="11.5" fill="#57534e">câu hỏi hoặc lời nhờ tìm nguồn hàng</text>
  <text x="40" y="392" fill="#1c1917">4. Nêu tác hại, chuyện cai, chính sách cấm,</text>
  <text x="40" y="412" font-size="11.5" fill="#57534e">tin xử lý vi phạm hoặc thái độ phản đối?</text>
  <text x="636" y="76" text-anchor="middle" fill="#1c1917">Không liên quan</text>
